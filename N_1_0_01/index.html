<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>N_1_0_01 — Wind &amp; Water</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed;
    background: #0b1320;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; touch-action: none; position: relative; z-index: 1; }

  #back {
    position: fixed; top: 18px; left: 20px;
    color: rgba(255,255,255,0.75);
    font-size: 10px; letter-spacing: .15em;
    text-decoration: none; text-transform: uppercase;
    font-family: 'Space Mono', monospace;
    background: rgba(0,0,0,0.18);
    padding: 6px 10px;
    border-radius: 3px;
    backdrop-filter: blur(4px);
    z-index: 10;
  }
  #back:hover { color: #fff; background: rgba(0,0,0,0.32); }

  #info {
    position: fixed; top: 18px; right: 20px;
    color: rgba(255,255,255,0.7);
    font-size: 10px; letter-spacing: .12em;
    text-align: right; line-height: 1.8;
    font-family: 'Space Mono', monospace;
    background: rgba(0,0,0,0.18);
    padding: 6px 10px;
    border-radius: 3px;
    backdrop-filter: blur(4px);
    z-index: 10;
  }

  #hint {
    position: fixed; left: 0; right: 0; bottom: 26px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    z-index: 10;
    transition: opacity 0.8s ease;
  }
  #hint span {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    background: rgba(0,0,0,0.18);
    padding: 6px 14px;
    border-radius: 3px;
    backdrop-filter: blur(4px);
    animation: pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }
  #hint.hidden { opacity: 0; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<a id="back" href="../../index.html">← back</a>
<div id="info">N_1_0_01<br>Wind &amp; Water</div>
<div id="hint"><span>touch the field</span></div>

<script>
new p5(function(p) {
  let W, H;
  let blades = [];
  let fireflies = [];
  let leaves = [];
  let ripples = [];
  let touchPoints = []; // {x,y,life}
  let hintEl, hinted = false;

  const PONDH_RATIO = 0.16;   // 画面下部・池の高さ比率
  const GRASS_RATIO = 0.34;   // 草地の高さ比率（池を含む）

  // ── 時刻から空の色を連続的に決める ──────────────
  function skyColors() {
    const now = new Date();
    const hf = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;

    // キーフレーム: [時刻, 上部色, 地平線色]
    const KF = [
      [0,  [222, 45, 10], [232, 40, 14]],
      [5,  [225, 45, 14], [255, 55, 22]],
      [7,  [205, 60, 55], [28,  75, 70]],
      [11, [200, 55, 70], [50,  35, 88]],
      [16, [205, 55, 65], [35,  60, 78]],
      [18, [255, 50, 35], [18,  80, 55]],
      [20, [240, 45, 16], [270, 50, 18]],
      [24, [222, 45, 10], [232, 40, 14]],
    ];
    let a = KF[0], b = KF[KF.length-1];
    for (let i = 0; i < KF.length-1; i++) {
      if (hf >= KF[i][0] && hf <= KF[i+1][0]) { a = KF[i]; b = KF[i+1]; break; }
    }
    const span = b[0]-a[0] || 1;
    const f = (hf - a[0]) / span;
    const lerp3 = (c1,c2,t) => [
      c1[0]+(c2[0]-c1[0])*t,
      c1[1]+(c2[1]-c1[1])*t,
      c1[2]+(c2[2]-c1[2])*t
    ];
    return {
      top: lerp3(a[1], b[1], f),
      horizon: lerp3(a[2], b[2], f),
      hf
    };
  }

  p.setup = function() {
    const cnv = p.createCanvas(window.innerWidth, window.innerHeight);
    cnv.style('display','block');
    W = p.width; H = p.height;
    p.colorMode(p.HSB, 360, 100, 100, 100);
    p.noStroke();
    hintEl = document.getElementById('hint');
    initScene();
  };

  function initScene() {
    blades = [];
    const grassTop = H * (1 - GRASS_RATIO);
    const n = Math.floor(W / 6);
    for (let i = 0; i < n; i++) {
      const x = (i / n) * W + p.random(-3,3);
      blades.push({
        x,
        baseY: grassTop + p.random(0, H*GRASS_RATIO*0.55),
        h: p.random(18, 46),
        hue: 95 + p.random(-15, 25),
        off: p.random(1000),
        bend: 0
      });
    }

    fireflies = [];
    const nf = 22;
    for (let i = 0; i < nf; i++) {
      fireflies.push({
        x: p.random(W), y: p.random(H*0.15, H*(1-PONDH_RATIO*1.2)),
        off: p.random(1000),
        speed: p.random(0.2, 0.6),
        size: p.random(2, 4)
      });
    }

    leaves = [];
    for (let i = 0; i < 8; i++) {
      leaves.push(spawnLeaf(p.random(H)));
    }
  }

  function spawnLeaf(y) {
    return {
      x: p.random(-50, W+50),
      y: y !== undefined ? y : -20,
      vx: p.random(0.3, 1.0) * (p.random()>0.5?1:-1),
      vy: p.random(0.4, 1.0),
      rot: p.random(p.TWO_PI),
      vrot: p.random(-0.03, 0.03),
      size: p.random(8, 16),
      hue: p.random(20, 50)
    };
  }

  // ── 描画 ──────────────────────────────────────
  p.draw = function() {
    const sky = skyColors();
    drawSky(sky);
    drawSun(sky);
    drawMountains(sky);
    drawClouds(sky);
    updateTouches();
    drawPond(sky);
    drawGrass(sky);
    drawFireflies(sky);
    drawLeaves();
  };

  function drawSky(sky) {
    const groundY = H * (1 - GRASS_RATIO);
    for (let y = 0; y < groundY; y++) {
      const t = y / groundY;
      const h = p.lerp(sky.top[0], sky.horizon[0], t);
      const s = p.lerp(sky.top[1], sky.horizon[1], t);
      const b = p.lerp(sky.top[2], sky.horizon[2], t);
      p.stroke(h, s, b);
      p.line(0, y, W, y);
    }
    p.noStroke();
  }

  function drawSun(sky) {
    // 時刻に応じて昇降する太陽/月
    const hf = sky.hf;
    const angle = p.map(hf, 0, 24, -p.HALF_PI*0.2, p.TWO_PI - p.HALF_PI*0.2);
    const groundY = H * (1 - GRASS_RATIO);
    const cx = W * 0.5 + p.cos(angle) * W * 0.55;
    const cy = groundY - Math.sin(angle) * groundY * 1.05;
    if (cy < groundY + 40) {
      const isNight = (hf < 5 || hf > 19);
      const hue = isNight ? 220 : 48;
      const sat = isNight ? 15 : 70;
      const bri = isNight ? 95 : 100;
      for (let r = 90; r > 0; r -= 12) {
        p.fill(hue, sat*0.6, bri, p.map(r,0,90,0,10));
        p.ellipse(cx, cy, r*2, r*2);
      }
      p.fill(hue, sat, bri, 90);
      p.ellipse(cx, cy, 34, 34);
    }
  }

  function drawClouds(sky) {
    const groundY = H * (1 - GRASS_RATIO);
    p.fill(sky.horizon[0], sky.horizon[1]*0.3, 100, 18);
    for (let i = 0; i < 4; i++) {
      const cx = ((i*0.27 + (p.frameCount*0.00006)) % 1.2 - 0.1) * W;
      const cy = groundY * (0.18 + i*0.13);
      const s  = 60 + i*18;
      p.ellipse(cx, cy, s*1.6, s*0.5);
      p.ellipse(cx+s*0.5, cy+4, s*1.1, s*0.45);
      p.ellipse(cx-s*0.5, cy+6, s*1.0, s*0.4);
    }
  }

  function drawMountains(sky) {
    const groundY = H * (1 - GRASS_RATIO);
    // 遠景・近景 2層
    [{amp:0.10, base:0.62, hueShift:10, alpha:60, freq:1.6, off:11},
     {amp:0.16, base:0.78, hueShift:-6, alpha:80, freq:2.3, off:77}]
    .forEach(layer => {
      p.fill(sky.horizon[0]+layer.hueShift, sky.horizon[1]*0.5, sky.horizon[2]*0.55, layer.alpha);
      p.beginShape();
      p.vertex(0, groundY);
      for (let x = 0; x <= W; x += W/40) {
        const ny = groundY*(1 - layer.base) +
                   Math.sin(x*0.004*layer.freq + layer.off) * groundY*layer.amp +
                   Math.sin(x*0.011*layer.freq + layer.off*2) * groundY*layer.amp*0.4;
        p.vertex(x, ny);
      }
      p.vertex(W, groundY);
      p.endShape(p.CLOSE);
    });
  }

  // ── タッチ管理 ──────────────────────────────
  function updateTouches() {
    const pts = p.touches.length > 0 ? p.touches
              : (p.mouseIsPressed ? [{x:p.mouseX,y:p.mouseY}] : []);

    for (const pt of pts) {
      touchPoints.push({x:pt.x, y:pt.y});
      // 池の中なら波紋
      if (pt.y > H*(1-PONDH_RATIO)) {
        if (p.frameCount % 4 === 0) ripples.push({x:pt.x, y:pt.y, r:2, alpha:70});
      }
    }
    if (touchPoints.length > 60) touchPoints.splice(0, touchPoints.length-60);
    // 古いタッチ位置を減衰
    touchPoints.forEach(tp => tp.age = (tp.age||0)+1);
    touchPoints = touchPoints.filter(tp => tp.age < 40);
  }

  function drawPond(sky) {
    const pondY = H*(1-PONDH_RATIO);
    for (let y = pondY; y < H; y++) {
      const t = (y-pondY)/(H-pondY);
      const h = p.lerp(sky.horizon[0], sky.horizon[0]+8, t);
      const s = p.lerp(sky.horizon[1]*0.7, sky.horizon[1]*0.5, t);
      const b = p.lerp(sky.horizon[2]*0.55, sky.horizon[2]*0.35, t);
      p.stroke(h, s, b, 100);
      p.line(0, y, W, y);
    }
    p.noStroke();

    // さざ波（常時微細に）
    p.stroke(sky.horizon[0], 20, 100, 12);
    for (let y = pondY+6; y < H; y += 10) {
      p.noFill();
      p.beginShape();
      for (let x = 0; x <= W; x += 12) {
        const wob = Math.sin(x*0.02 + p.frameCount*0.02 + y*0.3) * 1.5;
        p.vertex(x, y+wob);
      }
      p.endShape();
    }
    p.noStroke();

    // タッチによる波紋
    for (let i = ripples.length-1; i >= 0; i--) {
      const r = ripples[i];
      p.noFill();
      p.stroke(sky.top[0], 20, 100, r.alpha);
      p.strokeWeight(1.5);
      p.ellipse(r.x, r.y, r.r*2, r.r*0.6);
      r.r += 2.2;
      r.alpha -= 1.6;
      if (r.alpha <= 0) ripples.splice(i,1);
    }
    p.noStroke();
    p.strokeWeight(1);
  }

  function drawGrass(sky) {
    const t = p.frameCount * 0.02;
    for (const bl of blades) {
      // 自然な揺れ
      let sway = Math.sin(t + bl.off) * 6 + Math.sin(t*1.7 + bl.off*1.3) * 2;

      // タッチによる風（近いタッチほど強く曲がる）
      let gust = 0;
      for (const tp of touchPoints) {
        const d = Math.abs(bl.x - tp.x);
        if (d < 160) {
          const f = (1 - d/160) * (1 - tp.age/40);
          gust += (bl.x > tp.x ? 1 : -1) * f * 26;
        }
      }

      const lean = sway + gust;
      const x2 = bl.x + lean;
      const y2 = bl.baseY - bl.h;

      p.stroke(bl.hue, 55, 45 + (bl.h/46)*15, 90);
      p.strokeWeight(1.6);
      p.noFill();
      p.beginShape();
      p.vertex(bl.x, bl.baseY);
      p.quadraticVertex(bl.x + lean*0.5, bl.baseY - bl.h*0.55, x2, y2);
      p.endShape();
    }
    p.noStroke();
  }

  function drawFireflies(sky) {
    const isNight = (sky.hf < 5.5 || sky.hf > 18.5);
    const baseAlpha = isNight ? 70 : 18;
    const t = p.frameCount * 0.01;
    for (const f of fireflies) {
      f.x += Math.sin(t*f.speed + f.off) * 0.6;
      f.y += Math.cos(t*f.speed*0.8 + f.off*1.4) * 0.4;
      if (f.x < 0) f.x = W; if (f.x > W) f.x = 0;
      if (f.y < H*0.1) f.y = H*0.1;
      if (f.y > H*(1-PONDH_RATIO*1.2)) f.y = H*(1-PONDH_RATIO*1.2);

      // タッチに緩やかに引き寄せられる
      for (const tp of touchPoints) {
        const dx = tp.x-f.x, dy = tp.y-f.y;
        const d = Math.sqrt(dx*dx+dy*dy);
        if (d < 180 && d > 1) {
          f.x += dx/d * 0.6 * (1-tp.age/40);
          f.y += dy/d * 0.6 * (1-tp.age/40);
        }
      }

      const tw = (Math.sin(t*3 + f.off*5)+1)/2;
      const a = baseAlpha * (0.4 + tw*0.6);
      p.fill(50, 70, 100, a*0.3);
      p.ellipse(f.x, f.y, f.size*4, f.size*4);
      p.fill(50, 60, 100, a);
      p.ellipse(f.x, f.y, f.size, f.size);
    }
  }

  function drawLeaves() {
    const t = p.frameCount;
    for (let i = leaves.length-1; i >= 0; i--) {
      const l = leaves[i];
      // 風によるドリフト（タッチがあれば加速）
      let wind = Math.sin(t*0.01 + l.x*0.01) * 0.4;
      for (const tp of touchPoints) {
        const dx = l.x-tp.x;
        if (Math.abs(dx) < 200) wind += (dx>0?1:-1) * (1-Math.abs(dx)/200) * 1.5 * (1-tp.age/40);
      }
      l.x += l.vx + wind;
      l.y += l.vy;
      l.rot += l.vrot;

      p.push();
      p.translate(l.x, l.y);
      p.rotate(l.rot);
      p.fill(l.hue, 55, 75, 70);
      p.ellipse(0, 0, l.size, l.size*0.6);
      p.pop();

      if (l.y > H*(1-GRASS_RATIO*0.2) || l.x < -60 || l.x > W+60) {
        leaves[i] = spawnLeaf();
      }
    }
    if (Math.random() < 0.01 && leaves.length < 14) leaves.push(spawnLeaf());
  }

  // ── タッチ・スクロール対策 ──────────────────
  function isOnUI(event) {
    return event && event.target && event.target.closest &&
           (event.target.closest('#back'));
  }

  p.touchStarted = function(event) {
    if (isOnUI(event)) return true;
    if (!hinted) { hinted = true; hintEl.classList.add('hidden'); }
    return false;
  };
  p.touchMoved = function(event) {
    if (isOnUI(event)) return true;
    return false;
  };
  p.mousePressed = function() {
    if (!hinted) { hinted = true; hintEl.classList.add('hidden'); }
  };

  p.windowResized = function() {
    p.resizeCanvas(window.innerWidth, window.innerHeight);
    W = p.width; H = p.height;
    initScene();
  };
});

document.addEventListener('touchmove', function(e) {
  if (e.target.closest && e.target.closest('#back')) return;
  e.preventDefault();
}, { passive: false });
</script>
</body>
</html>
