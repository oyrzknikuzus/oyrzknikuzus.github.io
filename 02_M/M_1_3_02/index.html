<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>M_1_3_02 — Vortex</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0e0e0e;display:flex;align-items:center;justify-content:center;min-height:100vh}
  canvas{display:block}
  #back{position:fixed;top:24px;left:28px;color:#444;font-size:10px;letter-spacing:.15em;text-decoration:none;text-transform:uppercase;font-family:'Space Mono',monospace}
  #back:hover{color:#aaa}
  #info{position:fixed;top:24px;right:28px;color:#333;font-size:10px;letter-spacing:.12em;text-align:right;line-height:1.8;font-family:'Space Mono',monospace}
  #hint{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);color:#2a2a2a;font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-family:'Space Mono',monospace}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<a id="back" href="../../index.html">← back</a>
<div id="info">M_1_3_02<br>Vortex</div>
<div id="hint">click to reset</div>

<script>
new p5(function(p) {
  const N = 260;
  let agents = [];
  let pg;
  let t = 0;

  // multiple vortex centers
  let vortices = [];

  function initVortices() {
    vortices = [];
    let count = 3;
    for (let i = 0; i < count; i++) {
      vortices.push({
        x:      p.random(p.width  * 0.2, p.width  * 0.8),
        y:      p.random(p.height * 0.2, p.height * 0.8),
        str:    p.random(-1, 1) > 0 ? p.random(0.8, 1.8) : -p.random(0.8, 1.8),
        radius: p.random(80, 200)
      });
    }
  }

  class Agent {
    constructor() { this.init(); }
    init() {
      this.pos   = p.createVector(p.random(p.width), p.random(p.height));
      this.vel   = p5.Vector.random2D().mult(p.random(0.3, 1.5));
      this.sw    = p.random(0.15, 0.7);
      this.grey  = p.random(100, 215);
      this.alpha = p.random(20, 90);
      this.prev  = this.pos.copy();
      this.life  = 0;
      this.maxLife = p.random(300, 1000);
    }
    update() {
      this.prev = this.pos.copy();
      let force = p.createVector(0, 0);

      for (let v of vortices) {
        let dx = this.pos.x - v.x;
        let dy = this.pos.y - v.y;
        let d  = p.sqrt(dx*dx + dy*dy);
        if (d < v.radius && d > 1) {
          // tangential force (perpendicular to radius) + slight inward/outward
          let tang = p.createVector(-dy/d, dx/d).mult(v.str * p.map(d,0,v.radius,1.2,0));
          force.add(tang);
        }
      }

      // gentle global Perlin drift
      let nx = p.noise(this.pos.x*0.003, this.pos.y*0.003, t) * p.TWO_PI;
      force.add(p5.Vector.fromAngle(nx).mult(0.03));

      this.vel.add(force).limit(2.5);
      this.pos.add(this.vel);
      this.life++;

      if (this.pos.x < 0)        this.pos.x = p.width;
      if (this.pos.x > p.width)  this.pos.x = 0;
      if (this.pos.y < 0)        this.pos.y = p.height;
      if (this.pos.y > p.height) this.pos.y = 0;

      if (this.life > this.maxLife) this.init();
    }
    draw() {
      let fade = (this.life < 30)
        ? p.map(this.life, 0, 30, 0, this.alpha)
        : (this.life > this.maxLife * 0.85)
          ? p.map(this.life, this.maxLife*0.85, this.maxLife, this.alpha, 0)
          : this.alpha;
      pg.stroke(this.grey, this.grey, this.grey * 0.96, fade);
      pg.strokeWeight(this.sw);
      pg.line(this.prev.x, this.prev.y, this.pos.x, this.pos.y);
    }
  }

  p.setup = function() {
    p.createCanvas(p.min(p.windowWidth, 900), p.min(p.windowHeight, 600));
    pg = p.createGraphics(p.width, p.height);
    pg.background(14, 14, 14);
    initVortices();
    for (let i = 0; i < N; i++) agents.push(new Agent());
  };

  p.draw = function() {
    pg.fill(14, 14, 14, 7);
    pg.noStroke();
    pg.rect(0, 0, pg.width, pg.height);

    for (let a of agents) { a.update(); a.draw(); }
    p.image(pg, 0, 0);
    t += 0.0025;
  };

  p.mousePressed = function() {
    pg.background(14, 14, 14);
    agents = [];
    initVortices();
    for (let i = 0; i < N; i++) agents.push(new Agent());
    t = 0;
  };

  p.windowResized = function() {
    p.resizeCanvas(p.min(p.windowWidth, 900), p.min(p.windowHeight, 600));
    pg = p.createGraphics(p.width, p.height);
    pg.background(14, 14, 14);
  };
});
</script>
</body>
</html>
