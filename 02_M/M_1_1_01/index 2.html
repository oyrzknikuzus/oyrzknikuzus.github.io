<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>M_1_1_01 — Oscillation</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0e0e0e;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;font-family:'Space Mono',monospace}
  canvas{display:block}
  #ui{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:20px;align-items:center}
  .label{color:#555;font-size:10px;letter-spacing:.15em;text-transform:uppercase}
  #back{position:fixed;top:24px;left:28px;color:#444;font-size:10px;letter-spacing:.15em;text-decoration:none;text-transform:uppercase}
  #back:hover{color:#aaa}
  #info{position:fixed;top:24px;right:28px;color:#333;font-size:10px;letter-spacing:.12em;text-align:right;line-height:1.8}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<a id="back" href="../../index.html">← back</a>
<div id="info">
  M_1_1_01<br>Oscillation
</div>

<script>
new p5(function(p) {
  let t = 0;
  let trails = [];
  const WAVE_COUNT = 6;

  p.setup = function() {
    let cnv = p.createCanvas(p.min(p.windowWidth, 900), p.min(p.windowHeight, 600));
    cnv.style('display','block');
    p.background(14, 14, 14);
    // init trail buffers
    for (let i = 0; i < WAVE_COUNT; i++) trails.push([]);
  };

  p.draw = function() {
    // slow fade
    p.fill(14, 14, 14, 18);
    p.noStroke();
    p.rect(0, 0, p.width, p.height);

    let cx = p.width / 2;
    let cy = p.height / 2;

    for (let i = 0; i < WAVE_COUNT; i++) {
      let freq  = 1 + i * 0.7;
      let amp   = (p.height * 0.38) * (1 - i * 0.11);
      let phase = t * (0.4 + i * 0.13);
      let speed = 0.003 + i * 0.0015;
      let alpha = p.map(i, 0, WAVE_COUNT - 1, 200, 55);
      let grey  = p.map(i, 0, WAVE_COUNT - 1, 210, 80);

      p.stroke(grey, grey, grey, alpha);
      p.strokeWeight(p.map(i, 0, WAVE_COUNT - 1, 1.2, 0.4));
      p.noFill();
      p.beginShape();
      for (let x = 0; x <= p.width; x += 2) {
        let nx = (x / p.width) * p.TWO_PI * freq * 2;
        let y  = cy + p.sin(nx + phase) * amp
                    + p.sin(nx * 1.618 + phase * 0.7) * amp * 0.3;
        p.vertex(x, y);
      }
      p.endShape();
    }

    // center dot
    let dotY = cy + p.sin(t * 1.1) * (p.height * 0.3);
    p.noStroke();
    p.fill(240, 240, 235, 180);
    p.ellipse(cx, dotY, 4, 4);

    t += 0.012;
  };

  p.windowResized = function() {
    p.resizeCanvas(p.min(p.windowWidth, 900), p.min(p.windowHeight, 600));
  };
});
</script>
</body>
</html>
