<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>M_1_2_01 — Random Walk</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0e0e0e;display:flex;align-items:center;justify-content:center;min-height:100vh}
  canvas{display:block}
  #back{position:fixed;top:24px;left:28px;color:#444;font-size:10px;letter-spacing:.15em;text-decoration:none;text-transform:uppercase;font-family:'Space Mono',monospace}
  #back:hover{color:#aaa}
  #info{position:fixed;top:24px;right:28px;color:#333;font-size:10px;letter-spacing:.12em;text-align:right;line-height:1.8;font-family:'Space Mono',monospace}
  #hint{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);color:#2e2e2e;font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-family:'Space Mono',monospace}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<a id="back" href="../../index.html">← back</a>
<div id="info">M_1_2_01<br>Random Walk</div>
<div id="hint">click to reset</div>

<script>
new p5(function(p) {
  const NUM = 120;
  let agents = [];
  let pg; // persistent layer

  class Agent {
    constructor() { this.reset(); }
    reset() {
      this.x  = p.random(p.width);
      this.y  = p.random(p.height);
      this.px = this.x;
      this.py = this.y;
      this.no = p.random(1000);
      this.speed = p.random(1.2, 3.2);
      this.grey  = p.random(80, 210);
      this.alpha = p.random(30, 120);
      this.sw    = p.random(0.3, 1.1);
      this.life  = 0;
      this.maxLife = p.random(300, 900);
    }
    update() {
      this.px = this.x; this.py = this.y;
      let angle = p.noise(this.x * 0.003, this.y * 0.003, this.no) * p.TWO_PI * 3;
      this.x += p.cos(angle) * this.speed;
      this.y += p.sin(angle) * this.speed;
      this.no += 0.005;
      this.life++;
      if (this.life > this.maxLife ||
          this.x < 0 || this.x > p.width ||
          this.y < 0 || this.y > p.height) {
        this.reset();
      }
    }
    draw() {
      let fade = p.map(this.life, this.maxLife * 0.85, this.maxLife, this.alpha, 0);
      pg.stroke(this.grey, this.grey, this.grey * 0.95, fade);
      pg.strokeWeight(this.sw);
      pg.line(this.px, this.py, this.x, this.y);
    }
  }

  p.setup = function() {
    p.createCanvas(p.min(p.windowWidth, 900), p.min(p.windowHeight, 600));
    pg = p.createGraphics(p.width, p.height);
    pg.background(14, 14, 14);
    for (let i = 0; i < NUM; i++) agents.push(new Agent());
    p.noLoop();
    // run loop manually for better perf
    p.frameRate(60);
    p.loop();
  };

  p.draw = function() {
    // very slow fade on main canvas
    p.image(pg, 0, 0);
    for (let a of agents) { a.update(); a.draw(); }
  };

  p.mousePressed = function() {
    pg.background(14, 14, 14);
    agents = [];
    for (let i = 0; i < NUM; i++) agents.push(new Agent());
  };

  p.windowResized = function() {
    p.resizeCanvas(p.min(p.windowWidth, 900), p.min(p.windowHeight, 600));
    pg = p.createGraphics(p.width, p.height);
    pg.background(14, 14, 14);
  };
});
</script>
</body>
</html>
