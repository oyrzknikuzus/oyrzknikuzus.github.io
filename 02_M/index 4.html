<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>M_1_3_01 — Agents</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0e0e0e;display:flex;align-items:center;justify-content:center;min-height:100vh}
  canvas{display:block}
  #back{position:fixed;top:24px;left:28px;color:#444;font-size:10px;letter-spacing:.15em;text-decoration:none;text-transform:uppercase;font-family:'Space Mono',monospace}
  #back:hover{color:#aaa}
  #info{position:fixed;top:24px;right:28px;color:#333;font-size:10px;letter-spacing:.12em;text-align:right;line-height:1.8;font-family:'Space Mono',monospace}
  #hint{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);color:#2a2a2a;font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-family:'Space Mono',monospace}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<a id="back" href="../../index.html">← back</a>
<div id="info">M_1_3_01<br>Agents</div>
<div id="hint">move mouse · click to reset</div>

<script>
new p5(function(p) {
  const N = 300;
  let agents = [];
  let pg;
  let t = 0;

  class Agent {
    constructor() { this.init(); }
    init() {
      this.pos   = p.createVector(p.random(p.width), p.random(p.height));
      this.vel   = p5.Vector.random2D().mult(p.random(0.5, 2));
      this.acc   = p.createVector(0, 0);
      this.no    = p.random(1000);
      this.sw    = p.random(0.2, 0.9);
      this.grey  = p.random(90, 200);
      this.alpha = p.random(25, 100);
      this.prev  = this.pos.copy();
      this.life  = 0;
      this.maxLife = p.random(200, 700);
    }
    update() {
      this.prev = this.pos.copy();

      // noise-based force + mouse attraction (subtle)
      let nx = p.noise(this.pos.x * 0.004, this.pos.y * 0.004, t) * p.TWO_PI * 2;
      let force = p5.Vector.fromAngle(nx).mult(0.06);

      // mouse pull
      if (p.mouseX > 0) {
        let mouse = p.createVector(p.mouseX, p.mouseY);
        let d = p5.Vector.dist(this.pos, mouse);
        if (d < 180) {
          let pull = p5.Vector.sub(mouse, this.pos).normalize().mult(p.map(d,0,180,0.12,0));
          force.add(pull);
        }
      }

      this.acc = force;
      this.vel.add(this.acc).limit(2.8);
      this.pos.add(this.vel);
      this.life++;

      // wrap
      if (this.pos.x < 0)        this.pos.x = p.width;
      if (this.pos.x > p.width)  this.pos.x = 0;
      if (this.pos.y < 0)        this.pos.y = p.height;
      if (this.pos.y > p.height) this.pos.y = 0;

      if (this.life > this.maxLife) this.init();
    }
    draw() {
      let fade = (this.life < 40)
        ? p.map(this.life, 0, 40, 0, this.alpha)
        : (this.life > this.maxLife * 0.8)
          ? p.map(this.life, this.maxLife*0.8, this.maxLife, this.alpha, 0)
          : this.alpha;
      pg.stroke(this.grey, this.grey, this.grey * 0.97, fade);
      pg.strokeWeight(this.sw);
      pg.line(this.prev.x, this.prev.y, this.pos.x, this.pos.y);
    }
  }

  p.setup = function() {
    p.createCanvas(p.min(p.windowWidth, 900), p.min(p.windowHeight, 600));
    pg = p.createGraphics(p.width, p.height);
    pg.background(14, 14, 14);
    for (let i = 0; i < N; i++) agents.push(new Agent());
  };

  p.draw = function() {
    // very slight fade so old trails dissolve slowly
    pg.fill(14, 14, 14, 6);
    pg.noStroke();
    pg.rect(0, 0, pg.width, pg.height);

    for (let a of agents) { a.update(); a.draw(); }
    p.image(pg, 0, 0);
    t += 0.003;
  };

  p.mousePressed = function() {
    pg.background(14, 14, 14);
    agents = [];
    for (let i = 0; i < N; i++) agents.push(new Agent());
    t = 0;
  };

  p.windowResized = function() {
    p.resizeCanvas(p.min(p.windowWidth, 900), p.min(p.windowHeight, 600));
    pg = p.createGraphics(p.width, p.height);
    pg.background(14, 14, 14);
  };
});
</script>
</body>
</html>
