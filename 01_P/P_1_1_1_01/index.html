<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>P_1_1_1_01 — Falling Type</title>
<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    position: fixed;
    background: #0e0e0e;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
  }
  canvas { display: block; }

  #back {
    position: fixed; top: 20px; left: 24px;
    color: #444; font-size: 10px; letter-spacing: .15em;
    text-decoration: none; text-transform: uppercase;
    font-family: 'Space Mono', monospace;
    z-index: 10;
  }
  #back:hover { color: #aaa; }

  #info {
    position: fixed; top: 20px; right: 24px;
    color: #333; font-size: 10px; letter-spacing: .12em;
    text-align: right; line-height: 1.8;
    font-family: 'Space Mono', monospace;
    z-index: 10;
  }

  /* 下部の入力欄（タップでキーボードを呼び出す） */
  #typebar {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 16px 24px calc(16px + env(safe-area-inset-bottom));
    z-index: 10;
  }
  #typeInput {
    width: 100%; max-width: 480px;
    background: rgba(255,255,255,0.04);
    border: 1px solid #2a2c2d;
    border-radius: 4px;
    color: #c8cacc;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    letter-spacing: 0.08em;
    padding: 12px 16px;
    outline: none;
    text-align: center;
  }
  #typeInput::placeholder { color: #444; }
  #typeInput:focus { border-color: #8eb4c8; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
</head>
<body>
<a id="back" href="../../index.html">← back</a>
<div id="info">P_1_1_1_01<br>Falling Type</div>

<div id="typebar">
  <input id="typeInput" type="text" placeholder="tap here & type..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
</div>

<script>
new p5(function(p) {
  let letters = [];
  const COLORS = ['#8eb4c8', '#c8cacc', '#a0c8a0', '#c8a0a0', '#c8c08e'];

  p.setup = function() {
    const cnv = p.createCanvas(window.innerWidth, window.innerHeight);
    cnv.style('display', 'block');
    p.background(14, 14, 14);

    const input = document.getElementById('typeInput');

    // 入力ごとに文字を生成（最後に追加された1文字を取り出す）
    let prevLength = 0;
    input.addEventListener('input', () => {
      const val = input.value;
      if (val.length > prevLength) {
        const ch = val[val.length - 1];
        spawnLetter(ch);
      }
      prevLength = val.length;
      // 入力欄が長くなりすぎないようにリセット
      if (val.length > 40) {
        input.value = '';
        prevLength = 0;
      }
    });

    // バックスペースで全消去された場合に対応
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && input.value.length === 0) {
        prevLength = 0;
      }
    });

    // ページ表示時に自動でフォーカス（モバイルではタップが必要な場合あり）
    setTimeout(() => input.focus(), 300);
  };

  function spawnLetter(ch) {
    letters.push({
      ch: ch,
      x: p.random(p.width * 0.08, p.width * 0.92),
      y: -40,
      vy: p.random(2, 5),
      size: p.random(28, 64),
      rot: p.random(-0.3, 0.3),
      vrot: p.random(-0.02, 0.02),
      color: p.random(COLORS),
      alpha: 255
    });
  }

  p.draw = function() {
    // ゆるくフェードして軌跡を残す
    p.noStroke();
    p.fill(14, 14, 14, 28);
    p.rect(0, 0, p.width, p.height);

    p.textAlign(p.CENTER, p.CENTER);

    for (let i = letters.length - 1; i >= 0; i--) {
      const l = letters[i];
      p.push();
      p.translate(l.x, l.y);
      p.rotate(l.rot);
      p.textSize(l.size);
      p.textFont('Space Mono, monospace');
      const c = p.color(l.color);
      c.setAlpha(l.alpha);
      p.fill(c);
      p.text(l.ch, 0, 0);
      p.pop();

      l.y += l.vy;
      l.vy += 0.04; // 落下加速
      l.rot += l.vrot;

      // 画面下に近づいたらフェードアウト
      if (l.y > p.height * 0.78) {
        l.alpha -= 4;
      }
      if (l.y > p.height + 60 || l.alpha <= 0) {
        letters.splice(i, 1);
      }
    }
  };

  p.windowResized = function() {
    p.resizeCanvas(window.innerWidth, window.innerHeight);
    p.background(14, 14, 14);
  };
});
</script>
</body>
</html>
